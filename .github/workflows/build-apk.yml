name: Build JARVIS V7.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract JARVIS V7.1
        run: |
          rm -rf jarvis-source
          mkdir -p jarvis-source
          unzip -q JARVIS-V7.1-CODEMAGIC-FIXED.zip -d jarvis-source

      - name: Build APK
        run: |
          cd jarvis-source/android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V7.1-APK
          path: jarvis-source/android/app/build/outputs/apk/debug/*.apk
